<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Browser-Locker - Icon Generator</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #18181b;
      color: #f4f4f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px;
    }
    .preview-grid {
      display: flex;
      gap: 30px;
      align-items: flex-end;
      margin: 30px 0;
    }
    .preview-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    canvas {
      background: #27272a;
      border: 1px solid #3f3f46;
      border-radius: 6px;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 500;
      cursor: pointer;
      font-size: 13px;
    }
    button:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <h1 style="font-size: 20px;">Browser-Locker Icon Exporter</h1>
  <p style="color: #a1a1aa; font-size: 13px;">Generates PNG icons (16x16, 48x48, 128x128) using HTML5 Canvas.</p>

  <div class="preview-grid">
    <div class="preview-box">
      <canvas id="c128" width="128" height="128"></canvas>
      <span style="font-size: 12px; color: #a1a1aa;">128px</span>
      <button onclick="downloadIcon(128)">Download</button>
    </div>
    <div class="preview-box">
      <canvas id="c48" width="48" height="48"></canvas>
      <span style="font-size: 12px; color: #a1a1aa;">48px</span>
      <button onclick="downloadIcon(48)">Download</button>
    </div>
    <div class="preview-box">
      <canvas id="c16" width="16" height="16"></canvas>
      <span style="font-size: 12px; color: #a1a1aa;">16px</span>
      <button onclick="downloadIcon(16)">Download</button>
    </div>
  </div>

  <button onclick="downloadAll()">Download All 3 Icons</button>

  <script>
    const sizes = [16, 48, 128];
    const svgImg = new Image();
    svgImg.src = 'icon.svg';

    function draw() {
      sizes.forEach(size => {
        const canvas = document.getElementById(`c${size}`);
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, size, size);
        ctx.drawImage(svgImg, 0, 0, size, size);
      });
    }

    svgImg.onload = draw;

    function downloadIcon(size) {
      const canvas = document.getElementById(`c${size}`);
      const link = document.createElement('a');
      link.download = `icon${size}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    function downloadAll() {
      sizes.forEach(size => downloadIcon(size));
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browser-Locker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="lock-page">

  <!-- ═══════════ 1. UNLOCK VIEW ═══════════ -->
  <div class="lock-card" id="unlockCard">
    <svg class="lock-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
      <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
    </svg>

    <h1 class="lock-title">Browser Locked</h1>
    <p class="lock-subtitle" id="lockScreenMessage">Enter your master password to continue</p>

    <form id="unlockForm" class="form-group" autocomplete="off">
      <div class="password-container">
        <input
          type="password"
          id="passwordInput"
          class="native-input"
          placeholder="Master Password"
          required
          autofocus
          autocomplete="off"
        >
        <button type="button" class="toggle-pass-btn" id="togglePassBtn" aria-label="Toggle password visibility">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>
      </div>

      <div class="error-msg" id="errorMsg"></div>
      <button type="submit" class="btn-primary" id="unlockBtn">Unlock Browser</button>
    </form>

    <button type="button" class="btn-ghost" id="showRecoveryBtn">Forgot password?</button>
    <button type="button" class="btn-ghost" id="emergencyResetBtn" style="color: #ef4444; font-size: 12px; margin-top: 4px;">⚠️ Reset Password / Clear Storage</button>
  </div>

  <!-- ═══════════ 2. RECOVERY VIEW ═══════════ -->
  <div class="lock-card hidden" id="recoveryCard">
    <svg class="lock-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"></path>
    </svg>

    <h1 class="lock-title">Reset Master Password</h1>
    <p class="lock-subtitle">Enter your 16-character recovery key</p>

    <form id="recoveryForm" class="form-group" autocomplete="off">
      <div>
        <label class="field-label" for="recoveryKeyInput">Recovery Key</label>
        <input
          type="text"
          id="recoveryKeyInput"
          class="native-input"
          placeholder="XXXX-XXXX-XXXX-XXXX"
          required
          autocomplete="off"
          spellcheck="false"
          style="font-family: monospace; letter-spacing: 1px; text-transform: uppercase;"
        >
      </div>

      <div>
        <label class="field-label" for="newPassInput">New Master Password</label>
        <div class="password-container">
          <input
            type="password"
            id="newPassInput"
            class="native-input"
            placeholder="At least 4 characters"
            required
            minlength="4"
            autocomplete="off"
          >
          <button type="button" class="toggle-pass-btn" id="toggleNewPassBtn" aria-label="Toggle password visibility">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <div class="error-msg" id="recoveryErrorMsg"></div>
      <button type="submit" class="btn-primary" id="recoverySubmitBtn">Reset & Unlock</button>
    </form>

    <button type="button" class="btn-ghost" id="backToUnlockBtn">← Back to Unlock</button>
  </div>

  <!-- ═══════════ 3. FIRST-TIME SETUP VIEW ═══════════ -->
  <div class="lock-card hidden" id="setupCard">
    <svg class="lock-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
    </svg>

    <h1 class="lock-title">Initial Setup</h1>
    <p class="lock-subtitle">Create a master password to protect your browser</p>

    <form id="setupForm" class="form-group" autocomplete="off">
      <div>
        <label class="field-label" for="setupPassInput">Master Password</label>
        <div class="password-container">
          <input
            type="password"
            id="setupPassInput"
            class="native-input"
            placeholder="Choose master password"
            required
            minlength="4"
            autofocus
            autocomplete="off"
          >
          <button type="button" class="toggle-pass-btn" id="toggleSetupPassBtn" aria-label="Toggle password visibility">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <div>
        <label class="field-label" for="setupConfirmInput">Confirm Password</label>
        <div class="password-container">
          <input
            type="password"
            id="setupConfirmInput"
            class="native-input"
            placeholder="Confirm master password"
            required
            minlength="4"
            autocomplete="off"
          >
          <button type="button" class="toggle-pass-btn" id="toggleSetupConfirmBtn" aria-label="Toggle password visibility">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <div class="error-msg" id="setupErrorMsg"></div>
      <button type="submit" class="btn-primary" id="setupSubmitBtn">Save Master Password</button>
    </form>
  </div>

  <!-- ═══════════ 4. RECOVERY KEY GENERATED VIEW ═══════════ -->
  <div class="lock-card hidden" id="keyDisplayCard">
    <svg class="lock-icon" style="color: #facc15;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"></path>
    </svg>

    <h1 class="lock-title">Save Recovery Key</h1>
    <p class="lock-subtitle">Store this offline key in a safe place. It is the only way to reset your password if forgotten.</p>

    <div class="recovery-display">
      <div class="recovery-key-text" id="displayKeyText"></div>
    </div>

    <div class="recovery-actions">
      <button type="button" class="btn-secondary" id="copyKeyBtn">📋 Copy</button>
      <button type="button" class="btn-secondary" id="downloadKeyBtn">💾 Download</button>
    </div>

    <button type="button" class="btn-primary" id="doneSetupBtn">I Have Saved My Key — Continue</button>
  </div>

  <script src="crypto.js"></script>
  <script src="lock.js"></script>
</body>
</html>
